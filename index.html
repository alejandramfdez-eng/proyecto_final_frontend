<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .star-btn { cursor: pointer; font-size: 24px; color: #6c757d; background: none; border: none; }
        .star-btn.active { color: #ffc107; }
    </style>
</head>
<body class="bg-dark text-light p-4">

    <div class="container">
        <h1 class="text-center text-info mb-4">CineApp</h1>

        <div class="row g-2 justify-content-center mb-4">
            <div class="col-md-6">
                <input type="text" id="search-title" class="form-control" placeholder="Título de la película...">
            </div>
            <div class="col-md-2">
                <input type="number" id="search-year" class="form-control" placeholder="Año">
            </div>
            <div class="col-md-auto">
                <button id="search-btn" class="btn btn-info text-dark fw-bold">Buscar</button>
                <button id="clear-inputs-btn" class="btn btn-secondary">Limpiar</button>
            </div>
        </div>

        <div id="movies-list-section" class="row row-cols-1 row-cols-md-4 g-3" style="display: none;"></div>

        <div id="movie-detail-section" style="display: none;">
            <button id="btn-back-to-list" class="btn btn-sm btn-outline-secondary mb-3">⬅ Volver</button>
            
            <div class="row border border-secondary p-3 rounded bg-transparent">
                <div id="modal-info-block" class="col-md-6 text-center text-md-start"></div>
                <div class="col-md-6 border-start border-secondary">
                    <div class="mb-3 ps-2">
                        <h5 class="text-light">Calificación:</h5>
                        <div id="stars-selector">
                            <button class="star-btn" data-value="1">★</button>
                            <button class="star-btn" data-value="2">★</button>
                            <button class="star-btn" data-value="3">★</button>
                            <button class="star-btn" data-value="4">★</button>
                            <button class="star-btn" data-value="5">★</button>
                        </div>
                        <small id="star-description-text" class="text-muted">Sin calificaciones</small>
                        <div id="ratings-list" class="mt-2"></div>
                    </div>

                    <form id="comment-form" class="p-2">
                        <input type="text" id="comment-user" class="form-control form-control-sm mb-2" placeholder="Tu nombre" required>
                        <textarea id="comment-text" class="form-control form-control-sm mb-2" rows="3" placeholder="Escribe un comentario..." required></textarea>
                        <button type="submit" class="btn btn-sm btn-info w-100 text-dark fw-bold">Publicar</button>
                    </form>

                    <div id="comments-list" class="mt-3 p-2 overflow-auto" style="max-height: 200px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>
</html>
